<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Ascension</title>

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">ASCENSION</div>

        <nav class="nav-links">
            <a href="#">Dashboard</a>
            <a href="#">Training</a>
            <a href="#">Nutrition</a>
            <a href="#">Creator</a>
            <a href="#">Engineer</a>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>PROJECT ASCENSION</h1>
        <p>Discipline Over Motivation</p>

        <div class="hero-stats">
            <div class="card">
                <h2>60 kg</h2>
                <p>Current Weight</p>
            </div>

            <div class="card">
                <h2>Calisthenics</h2>
                <p>Training System</p>

                <h2>B.Tech</h2>
                <p>Engineering Track</p>
            </div>
        </div>

       <button class="btn" id="start-session-btn">Start Training Session</button>
       <button class="btn" id="clear-log-btn" style="background: transparent; border: 1px solid var(--muted); color: var(--muted); margin-left: 10px;">Wipe Logs</button>
       <div id="training-log" style="margin-top: 20px; text-align: center; color: var(--muted); font-size: 14px;">
    </div>
    </section>
<script src="assets/js/app.js"></script>
